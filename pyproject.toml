[project]
name = "tableau-extract"
version = "0.0.0"
description = "Extrahiert die Daten einer Tableau-Kartenansicht je Landkreis exakt als Tabelle."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
probe = [
    "playwright>=1.48",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableau_extract"]

[tool.ruff]
line-length = 100
target-version = "py311"
